<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern 3D Tasarım Aracı</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        /* --- Temel Değişkenler ve Sıfırlama --- */
        :root {
            --bg-main: #18181b;
            --bg-panel: #27272a;
            --bg-topbar: #202024;
            --text-main: #e4e4e7;
            --text-muted: #a1a1aa;
            --accent: #3b82f6;
            --border: #3f3f46;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            display: flex; 
            height: 100vh; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            overflow: hidden; 
        }

        /* --- Sol Panel (Ağaç ve Özellikler) --- */
        .sidebar {
            width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-section {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            flex: 1;
            overflow-y: auto;
        }

        .sidebar-section h3 {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        /* Form Elemanları */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: border 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent); }

        /* --- Ana İçerik Alanı --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Üst Bar */
        .topbar {
            height: 60px;
            background-color: var(--bg-topbar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .project-title { font-weight: 600; font-size: 16px; }

        .toolbar { display: flex; gap: 10px; }
        
        .btn {
            background-color: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn:hover { background-color: var(--border); }
        .btn.primary { background-color: var(--accent); border-color: var(--accent); }
        .btn.primary:hover { background-color: #2563eb; }

        /* Çalışma Alanı (2D ve 3D Yan Yana) */
        .workspace {
            flex: 1;
            display: flex;
            position: relative;
        }

        .view-2d {
            flex: 1;
            background-color: #f8fafc; /* Milimetrik kağıt hissi için açık renk */
            border-right: 1px solid var(--border);
            position: relative;
            background-image: 
                linear-gradient(#e2e8f0 1px, transparent 1px),
                linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 20px 20px; /* Grid deseni */
        }

        .view-3d {
            flex: 1;
            background-color: #111111;
            position: relative;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* Viewport Başlıkları */
        .view-title {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 5;
            pointer-events: none;
        }
        .view-2d .view-title { background: rgba(255,255,255,0.8); color: #333; font-weight: bold; border: 1px solid #ccc; }

    </style>
</head>
<body>

    <!-- Sol Panel -->
    <div class="sidebar">
        <!-- Tasarım Ağacı (Katmanlar) -->
        <div class="sidebar-section" style="flex: 1;">
            <h3>Design Tree</h3>
            <div style="font-size: 13px; color: #ccc;">
                <p>📁 Masa Tasarımı</p>
                <p style="margin-left: 15px; color: var(--accent);">↳ 🧊 Ön Ayak (Seçili)</p>
                <p style="margin-left: 15px;">↳ 🧊 Arka Ayak</p>
                <p style="margin-left: 15px;">↳ 🗄️ Üst Tabla</p>
            </div>
        </div>

        <!-- Özellikler Editörü -->
        <div class="sidebar-section" style="flex: 1.5;">
            <h3>Properties Editor</h3>
            
            <div class="form-group">
                <label>Parça Adı</label>
                <input type="text" value="Ön Ayak">
            </div>
            
            <div class="form-group">
                <label>Şekil</label>
                <select>
                    <option value="box">Kutu / Plaka</option>
                    <option value="cylinder" selected>Silindir / Direk</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Çap (cm)</label>
                    <input type="number" value="5">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Yükseklik (cm)</label>
                    <input type="number" value="45">
                </div>
            </div>

            <div class="form-group">
                <label>Kot (Zeminden Yükseklik)</label>
                <input type="number" value="0">
            </div>

            <button class="btn primary" style="width: 100%; margin-top: 10px;">Değişiklikleri Uygula</button>
        </div>
    </div>

    <!-- Ana İçerik -->
    <div class="main-content">
        
        <!-- Üst Araç Çubuğu -->
        <div class="topbar">
            <div class="project-title">Arctica Studio - Masa Tasarımı</div>
            <div class="toolbar">
                <button class="btn">✏️ Çizgi Aracı</button>
                <button class="btn">✋ Kaydır (Pan)</button>
                <div style="width: 1px; background: var(--border); margin: 0 5px;"></div>
                <button class="btn">⬇️ Dışa Aktar</button>
            </div>
        </div>

        <!-- Çalışma Alanı (Split Screen) -->
        <div class="workspace">
            
            <!-- 2D Çizim Alanı (Blueprint) -->
            <div class="view-2d" id="container-2d">
                <div class="view-title">2D Teknik Çizim (Üstten Görünüm)</div>
                <canvas id="canvas2d"></canvas>
            </div>

            <!-- 3D Görüntüleme Alanı -->
            <div class="view-3d" id="container-3d">
                <div class="view-title">3D Perspektif</div>
                <!-- Three.js Canvas'ı buraya eklenecek -->
            </div>

        </div>
    </div>

    <!-- Temel JavaScript Bağlantıları -->
    <script>
        // --- 2D Canvas Kurulumu ---
        const canvas2d = document.getElementById('canvas2d');
        const ctx = canvas2d.getContext('2d');
        const container2d = document.getElementById('container-2d');

        function resize2D() {
            canvas2d.width = container2d.clientWidth;
            canvas2d.height = container2d.clientHeight;
            // Test için ortada bir daire çizelim (Seçili "Ön Ayak" temsili)
            ctx.clearRect(0, 0, canvas2d.width, canvas2d.height);
            ctx.beginPath();
            ctx.arc(canvas2d.width/2, canvas2d.height/2, 40, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(59, 130, 246, 0.3)"; // Mavi vurgu
            ctx.fill();
            ctx.strokeStyle = "#3b82f6";
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        window.addEventListener('resize', resize2D);
        resize2D();

        // --- 3D Three.js Kurulumu (Örnek Silindir) ---
        const container3d = document.getElementById('container-3d');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(50, container3d.clientWidth / container3d.clientHeight, 0.1, 1000);
        camera.position.set(100, 100, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container3d.clientWidth, container3d.clientHeight);
        container3d.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Işıklar
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // Zemin Grid'i
        scene.add(new THREE.GridHelper(200, 20, 0x444444, 0x222222));

        // Örnek Seçili Parça (Silindir / Ön Ayak)
        const geometry = new THREE.CylinderGeometry(15, 15, 60, 32);
        const material = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.4 });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.y = 30; // Yüksekliğin yarısı (zemine oturtmak için)
        scene.add(mesh);

        function animate3D() {
            requestAnimationFrame(animate3D);
            controls.update();
            renderer.render(scene, camera);
        }
        animate3D();

        // 3D Ekranı yeniden boyutlandırma
        window.addEventListener('resize', () => {
            camera.aspect = container3d.clientWidth / container3d.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container3d.clientWidth, container3d.clientHeight);
        });
    </script>
</body>
</html>
